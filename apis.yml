aid: hidden-door
name: Hidden Door
description: 'Hidden Door is an interactive storytelling platform where roleplay meets fan fiction,
  letting players step into imaginative worlds and shape branching narratives through their choices.
  Players pick a pre-built world, add modifiers, create a character, and experience a unique story
  with a full cast of characters, where every playthrough differs. Creators can build playable worlds
  in as little as thirty minutes, then share, publish, and get paid when others play. The company was
  surfaced as a portfolio company of Homebrew and Northzone and added to the API Evangelist network.
  Hidden Door ships a consumer web experience and publishes no developer API, SDK, or developer portal
  at this time. Sector: AI / entertainment.'
